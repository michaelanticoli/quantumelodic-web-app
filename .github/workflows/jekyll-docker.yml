name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read

jobs:
  backend:
    name: Backend – lint & smoke-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Smoke-test – import Flask app factory
        run: |
          PYTHONPATH=backend python - <<'EOF'
          from api.main import create_app
          app = create_app()
          assert app is not None, "create_app() returned None"
          print("Flask app factory OK")
          EOF

  frontend:
    name: Frontend – lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
